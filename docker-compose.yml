
services:
  eureka-server:
    build:
      # Esse trecho é combinado com o COPY do dockerfile = ..eureka-erver/target/*.jar
      context: services/eureka-server
      dockerfile: ../../infra/docker/jre/Dockerfile
    container_name: easy-video-eureka
    ports:
      - ${EUREKA_PORT}:${EUREKA_PORT}
    environment:
      EUREKA_URL: ${EUREKA_URL}
      APP_EUREKA_HOSTNAME: ${APP_EUREKA_HOSTNAME}
      EUREKA_PORT: ${EUREKA_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${EUREKA_PORT}/actuator/health"]
    networks:
      - easy-video
    restart: unless-stopped

  gateway:
    build:
      context: services/gateway
      dockerfile: ../../infra/docker/jre/Dockerfile
    container_name: easy-video-gateway
    ports:
      - ${GATEWAY_PORT}:${GATEWAY_PORT}
    environment:
      APP_GATEWAY_HOSTNAME: ${APP_GATEWAY_HOSTNAME}
      EUREKA_URL: ${EUREKA_URL}
      GATEWAY_PORT: ${GATEWAY_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${GATEWAY_PORT}/actuator/health"]
    networks:
      - easy-video
    restart: unless-stopped
    depends_on:
      eureka-server: 
        condition: service_healthy 

  orquestrador:
    build:
      context: services/orquestrador
      dockerfile: ../../infra/docker/jre/Dockerfile
    container_name: easy-video-orquestrador
    ports:
      - ${ORQUESTRADOR_PORT}:${ORQUESTRADOR_PORT}
    environment:
      APP_ORQUESTRADOR_HOSTNAME: ${APP_ORQUESTRADOR_HOSTNAME}
      EUREKA_URL: ${EUREKA_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_NODE_PORT: ${RABBITMQ_NODE_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD}
      ORQUESTRADOR_PORT: ${ORQUESTRADOR_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${ORQUESTRADOR_PORT}/actuator/health"]
    networks:
      - easy-video
    restart: unless-stopped
    depends_on:
      eureka-server: 
        condition: service_healthy 
      rabbitmq: 
        condition: service_healthy

  midia-extrator:
    build:
      context: services/midia-extrator
      dockerfile: ../../infra/docker/jre/Dockerfile
    container_name: easy-video-midia-extrator
    ports:
      - ${MIDIA_EXTRATOR_PORT}:${MIDIA_EXTRATOR_PORT}
    environment:
      APP_MIDIA_EXTRATOR_HOSTNAME: ${APP_MIDIA_EXTRATOR_HOSTNAME}
      EUREKA_URL: ${EUREKA_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_NODE_PORT: ${RABBITMQ_NODE_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD}
      MIDIA_EXTRATOR_PORT: ${MIDIA_EXTRATOR_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${MIDIA_EXTRATOR_PORT}/actuator/health"]
    networks:
      - easy-video
    restart: unless-stopped
    depends_on:
      eureka-server: 
        condition: service_healthy 
      rabbitmq: 
        condition: service_healthy

  rabbitmq:
    build:
      context: .
      dockerfile: infra/docker/rabbitmq/Dockerfile
    container_name: easy-video-rabbitmq
    ports:
      - ${RABBITMQ_NODE_PORT}:${RABBITMQ_NODE_PORT}
      - ${RABBITMQ_MANAGEMENT_TCP_PORT}:${RABBITMQ_MANAGEMENT_TCP_PORT}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD}
      RABBITMQ_NODE_PORT: ${RABBITMQ_NODE_PORT}
      RABBITMQ_MANAGEMENT_TCP_PORT: ${RABBITMQ_MANAGEMENT_TCP_PORT}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq     # Mapeando diretório do host para volume no container
    networks:
      - easy-video
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: infra/docker/grafana/Dockerfile
    container_name: easy-video-grafana
    ports:
      - ${GF_SERVER_HTTP_PORT}:${GF_SERVER_HTTP_PORT}
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS}
      GF_SERVER_HTTP_PORT: ${GF_SERVER_HTTP_PORT}
    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_log:/var/log/grafana
    networks:
      - easy-video
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: easy-video-prometheus
    ports:
      - ${PROMETHEUS_PORT}:${PROMETHEUS_PORT}
    environment:
      PROMETHEUS_PORT: ${PROMETHEUS_PORT}
    volumes:
      #- ./infra/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml # bindMount - Mapeia arquivo no host para arquivo dentro do container
      - prometheus_data:/prometheus
    networks:
      - easy-video
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: easy-video-loki
    ports:
      - ${LOKI_PORT}:${LOKI_PORT}
    environment:
      LOKI_PORT: ${LOKI_PORT}
    volumes:
      # - ./infra/observabilidade/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml       # Sobrescreve o comando padrão do container para usar o arquivo de configuração personalizado
    networks:
      - easy-video
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: easy-video-promtail
    volumes:
      # Acesso a logs docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # - ./infra/observabilidade/loki/promtail-config.yml:/etc/promtail/config.yml 
      - promtail_data:/tmp
    command: -config.file=/etc/promtail/config.yml
    networks:
      - easy-video
    restart: unless-stopped

  

volumes:
  rabbitmq_data:    # Declarando o volume para persistência
    driver: local   # Driver padrão do Docker para volumes
  grafana_data:
    driver: local
  grafana_log:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local

  
networks:
  easy-video:
    driver: bridge
 


